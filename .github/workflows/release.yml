# Vigil release: cross-platform binaries, archives, SHA256SUMS signed with
# cosign (keyless, GitHub OIDC), .deb/.rpm, package-manager manifests and a
# multi-arch container image on ghcr.io/llcforge/vigil.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  BIN: vigil
  # Pinned so release builds are reproducible; bump deliberately.
  ZIGLANG_VERSION: "0.13.0"
  CARGO_ZIGBUILD_VERSION: "0.19.8"

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu, zig: true, pkg: true }
          - { os: ubuntu-latest, target: aarch64-unknown-linux-gnu, zig: true, pkg: true }
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl, zig: true }
          - { os: ubuntu-latest, target: aarch64-unknown-linux-musl, zig: true }
          - { os: macos-latest, target: x86_64-apple-darwin }
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
          - { os: windows-latest, target: aarch64-pc-windows-msvc }
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Install zig + cargo-zigbuild
        if: matrix.zig
        run: pip install "ziglang==${ZIGLANG_VERSION}" "cargo-zigbuild==${CARGO_ZIGBUILD_VERSION}"
      - name: Build (zigbuild)
        if: matrix.zig
        run: cargo zigbuild --release --locked --target ${{ matrix.target }}
      - name: Build
        if: ${{ !matrix.zig }}
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package (tar.gz)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          NAME="${BIN}-${VERSION}-${{ matrix.target }}"
          mkdir -p "dist/${NAME}"
          cp "target/${{ matrix.target }}/release/${BIN}" "dist/${NAME}/"
          cp LICENSE NOTICE README.md "dist/${NAME}/"
          cp README.tr.md "dist/${NAME}/" 2>/dev/null || true
          cp "${BIN}.example.toml" "dist/${NAME}/" 2>/dev/null || true
          tar -C dist -czf "dist/${NAME}.tar.gz" "${NAME}"
          rm -rf "dist/${NAME}"
      - name: Package (zip)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          $name = "$($env:BIN)-$version-${{ matrix.target }}"
          New-Item -ItemType Directory -Force "dist/$name" | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/$($env:BIN).exe" "dist/$name/"
          Copy-Item LICENSE, NOTICE, README.md "dist/$name/"
          foreach ($f in @('README.tr.md', "$($env:BIN).example.toml", 'packaging/windows/install-service.ps1', 'packaging/windows/README.md')) {
            if (Test-Path $f) { Copy-Item $f "dist/$name/" }
          }
          Compress-Archive -Path "dist/$name/*" -DestinationPath "dist/$name.zip"
          Remove-Item -Recurse -Force "dist/$name"

      - name: .deb and .rpm
        if: matrix.pkg
        shell: bash
        run: |
          set -euo pipefail
          cargo install --locked cargo-deb cargo-generate-rpm
          cargo deb --no-build --no-strip --target ${{ matrix.target }} --output dist/
          cargo generate-rpm --target ${{ matrix.target }} --output dist/

      - uses: actions/upload-artifact@v7
        with:
          name: dist-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: checksums, signatures, GitHub release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write # keyless cosign signing via GitHub OIDC
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - name: SHA256SUMS
        working-directory: dist
        run: sha256sum -- * | sort -k2 > SHA256SUMS && cat SHA256SUMS
      - uses: sigstore/cosign-installer@v3
      - name: Sign SHA256SUMS (keyless)
        working-directory: dist
        run: cosign sign-blob --yes --bundle SHA256SUMS.cosign.bundle SHA256SUMS
      - name: Render package-manager manifests
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          sum() { awk -v f="${BIN}-${VERSION}-$1.$2" '$2==f {print $1}' dist/SHA256SUMS; }
          mkdir -p dist/manifests
          for f in packaging/homebrew/${BIN}.rb packaging/scoop/${BIN}.json packaging/winget/*.yaml; do
            [ -f "$f" ] || continue
            sed -e "s/@VERSION@/${VERSION}/g" \
                -e "s/@SHA256_X86_64_APPLE_DARWIN@/$(sum x86_64-apple-darwin tar.gz)/g" \
                -e "s/@SHA256_AARCH64_APPLE_DARWIN@/$(sum aarch64-apple-darwin tar.gz)/g" \
                -e "s/@SHA256_X86_64_LINUX_MUSL@/$(sum x86_64-unknown-linux-musl tar.gz)/g" \
                -e "s/@SHA256_AARCH64_LINUX_MUSL@/$(sum aarch64-unknown-linux-musl tar.gz)/g" \
                -e "s/@SHA256_X86_64_WINDOWS@/$(sum x86_64-pc-windows-msvc zip)/g" \
                -e "s/@SHA256_AARCH64_WINDOWS@/$(sum aarch64-pc-windows-msvc zip)/g" \
                "$f" > "dist/manifests/$(basename "$f")"
          done
          (cd dist/manifests && tar -czf "../${BIN}-${VERSION}-package-manifests.tar.gz" .)
          rm -rf dist/manifests
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "Vigil $GITHUB_REF_NAME" \
            --generate-notes \
            --verify-tag

  docker:
    name: container image
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/llcforge/vigil
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
      - id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: sigstore/cosign-installer@v3
      - name: Sign image (keyless)
        run: cosign sign --yes "ghcr.io/llcforge/vigil@${{ steps.push.outputs.digest }}"
